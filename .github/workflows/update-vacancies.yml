name: Update vacancies daily

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC (6am UK in winter, 7am in summer)
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-vacancies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest vacancies from GOV.UK
        run: node scripts/update-vacancies.js

      - name: Save updated vacancies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vacancies.json
          if git diff --cached --quiet; then
            echo "No changes to vacancies today."
          else
            git commit -m "Update vacancies $(date -u +%Y-%m-%d)"
            git push
          fi
